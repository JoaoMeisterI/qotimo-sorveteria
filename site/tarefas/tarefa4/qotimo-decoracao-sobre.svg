<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Onda de sorvete Qótimo</title>
  <desc id="desc">Ilustração decorativa de sorvete e ondas brancas com pequenas gotas vermelhas.</desc>

  <!-- Fundo transparente: o azul da seção aparece por trás do desenho. -->
  <g stroke="#F6EFE6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Contornos abertos do sorvete italiano, à esquerda. -->
    <path d="M121 224c-12-21-2-43 24-56-5-18 4-34 26-44-11-15-8-31 9-43-9-21 3-43 28-56 25-14 55-11 63 1 6 10-2 20-13 20" stroke-width="9"/>
    <path d="M208 25c-14 22-5 37 13 48 23 14 49 23 48 47-1 12-10 21-22 27 30 10 47 29 39 47-5 12-19 22-39 29" stroke-width="8"/>
    <path d="M180 81c1 18 22 26 47 31 28 6 44 14 42 28" stroke-width="7"/>
    <path d="M170 125c3 15 27 23 60 24 25 1 45 5 56 15" stroke-width="8"/>
    <path d="M145 168c8 19 42 25 78 26 26 1 43 5 50 13" stroke-width="8"/>
    <path d="M127 210c30 17 81 20 125 8" stroke-width="8"/>
  </g>

  <!-- Faixa orgânica contínua que atravessa a seção e se afina nas bordas. -->
  <path d="M0 179c88 51 171 70 260 67 118-4 185-58 293-85 112-28 212-21 312 18 91 36 167 62 254 58 72-4 111-36 179-45 58-8 104 3 142 12" stroke="#F6EFE6" stroke-width="10" stroke-linecap="round"/>
  <path d="M260 234c120-7 195-60 301-77 105-16 191-9 292 29 92 35 165 61 244 50" stroke="#F6EFE6" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
  <path d="M1090 236c42-1 91-25 123-43 34-20 72-16 83-1 9 13-6 24-25 27" stroke="#F6EFE6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pequenos pingos vermelhos retomam a cor das ondas do site. -->
  <g fill="#E63939">
    <path d="M79 126c-19-8-25-22-18-33 9-14 24-3 31 12 7 14 16 24 27 34-16-3-28-9-40-13Z"/>
    <circle cx="92" cy="151" r="7"/>
    <path d="M1311 142c10-23 20-33 35-30 10 2 13 10 8 17-6 9-21 13-43 13Z"/>
    <circle cx="1293" cy="159" r="6"/>
  </g>
</svg>
